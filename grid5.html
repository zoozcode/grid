<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        height: 100vh;
        width: 1000px;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(6, 1fr);
        grid-template-areas:
          "box1 box1 box1 box1 box1 box1"
          "box2 box2 box3 box3 box3 box3"
          "box2 box2 box3 box3 box3 box3"
          "box2 box2 box4 box4 box5 box5"
          "box2 box2 box4 box4 box5 box5"
          "box6 box6 box6 box6 box6 box6";
      }

      .box {
        background-color: blue;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 30px;
      }

      @media (max-width: 768px) {
        .container {
          width: 400px;
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: repeat(8, 1fr);
          grid-template-areas:
            "box1 box1"
            "box2 box2"
            "box2 box2"
            "box3 box3"
            "box3 box3"
            "box4 box4"
            "box5 box5"
            "box6 box6";
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" style="grid-area: box1">header</div>
      <div class="box" style="grid-area: box2">sidebar</div>
      <div class="box" style="grid-area: box3">main</div>
      <div class="box" style="grid-area: box4">section</div>
      <div class="box" style="grid-area: box5">content</div>
      <div class="box" style="grid-area: box6">footer</div>
    </div>
  </body>
</html>
