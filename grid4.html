<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        height: 100vh;
        width: 1000px;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        grid-template-areas:
          "box1 box1 box2"
          "box3 box4 box2"
          "box3 box5 box5";
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: repeat(4, 1fr);
          grid-template-areas:
           "box1 box2"
           "box1 box3"
           "box4 box3"
           "box5 box5";
        }
      }

      .box {
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" style="grid-area: box1">1</div>
      <div class="box" style="grid-area: box2">2</div>
      <div class="box" style="grid-area: box3">3</div>
      <div class="box" style="grid-area: box4">4</div>
      <div class="box" style="grid-area: box5">5</div>
    </div>
  </body>
</html>
