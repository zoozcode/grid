<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            height: 100vh;
            width: 1000px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            grid-template-areas: 
            "box1 box2 box3"
            "box1 box4 box3"
            "box5 box4 box6";
        }

        /* .box{
            background-color: blue;
        } */

        .box{
            background-image: url("image/batikibnu.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        @media(max-width: 768px){
            .container{
                width: 400px;
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box1;">1</div>
        <div class="box" style="grid-area: box2;">2</div>
        <div class="box" style="grid-area: box3;">3</div>
        <div class="box" style="grid-area: box4;">4</div>
        <div class="box" style="grid-area: box5;">5</div>
        <div class="box" style="grid-area: box6;">6</div>
    </div>
</body>
</html>
